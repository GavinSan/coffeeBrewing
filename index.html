<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="A bean-first brew log: beans, recipes, timer, taste and cost.">
<meta name="theme-color" content="#F4EEE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brewing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
<main id="app"></main>
<nav id="nav" aria-label="Main"></nav>
<div id="fall" aria-hidden="true"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // when a new version takes over, reload once so it shows straight away (not mid-brew)
  var hadWorker = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadWorker || reloaded || /^#\/?timer/.test(location.hash)) return;
    reloaded = true; location.reload();
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
